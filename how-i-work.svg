<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="How I work: 1. Find the question. 2. Get the data right. 3. Build the view. 4. Drive the decision.">
  <style>
    .st { fill: #E6EDF3; animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
    @keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .st { opacity: .5 } }
    .num { fill: #768390; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; }
    .t { fill: #F0F3F6; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .d { fill: #8B949E; font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .lit { opacity: 0; animation: lit 6s ease-out infinite; }
    @keyframes lit { 0% { opacity: 1 } 30% { opacity: 0 } 100% { opacity: 0 } }
  </style>
  <defs>
    <radialGradient id="sky" cx="78%" cy="45%" r="85%">
      <stop offset="0" stop-color="#0F2A2E"/><stop offset=".55" stop-color="#0A141C"/><stop offset="1" stop-color="#05080D"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0F766E"/><stop offset="1" stop-color="#99F6E4"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".45"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".25"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
  </defs>
