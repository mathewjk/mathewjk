  <path d="M150 110C300 60 300 60 450 110S600 160 750 110 900 60 1050 110" fill="none" stroke="#30363D" stroke-width="1.5" stroke-dasharray="3 7"/>
  <g>
      <circle cx="150" cy="110" r="22" fill="#0A141C" stroke="#30363D" stroke-width="1.5"/>
      <circle class="lit" cx="150" cy="110" r="22" fill="none" stroke="#2DD4BF" stroke-width="2" style="animation-delay:0s"/>
