      <text class="num" x="150" y="66" text-anchor="middle">01</text>
      <text class="t" x="150" y="178" text-anchor="middle">Find the question</text>
      <text class="d" x="150" y="208" text-anchor="middle">Start from the decision,</text>
      <text class="d" x="150" y="232" text-anchor="middle">not the dataset.</text>
    </g><g>
      <circle cx="450" cy="110" r="22" fill="#0A141C" stroke="#30363D" stroke-width="1.5"/>
      <circle class="lit" cx="450" cy="110" r="22" fill="none" stroke="#2DD4BF" stroke-width="2" style="animation-delay:2s"/>
      <circle cx="450" cy="110" r="6" fill="#2DD4BF"/>
      <text class="num" x="450" y="66" text-anchor="middle">02</text>
      <text class="t" x="450" y="178" text-anchor="middle">Get the data right</text>
      <text class="d" x="450" y="208" text-anchor="middle">Clean, joined and trusted</text>
      <text class="d" x="450" y="232" text-anchor="middle">before anyone sees a chart.</text>
    </g><g>
      <circle cx="750" cy="110" r="22" fill="#0A141C" stroke="#30363D" stroke-width="1.5"/>
