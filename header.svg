<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Mathew Joseph. Data, product and AI. Turning operational data into decisions.">
  <style>
    .st { fill: #E6EDF3; animation: tw 4s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
    @keyframes up { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .st { opacity: .5 } }
    .meta { fill: #2DD4BF; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 4px; }
    .name { fill: #F0F3F6; font: 700 80px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -3px; }
    .tag { fill: #F0F3F6; font: 500 30px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -.5px; }
    .sub { fill: #8B949E; font: 400 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .a1, .a2, .a3, .a4 { opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .a1 { animation-delay: .1s } .a2 { animation-delay: .35s } .a3 { animation-delay: .6s } .a4 { animation-delay: .85s }
    .pulse { animation: pu 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pu { 0%,100% { transform: scale(1); opacity: .7 } 50% { transform: scale(1.3); opacity: 1 } }
    .trend { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.8s 1.1s cubic-bezier(.4,0,.2,1) forwards; }
    .areaf { opacity: 0; animation: fade 1s 2.2s ease forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @keyframes fade { to { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .a1,.a2,.a3,.a4,.areaf { opacity: 1 } .trend { stroke-dashoffset: 0 } }
  </style>
