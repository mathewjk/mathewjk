<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Mathew Joseph — Turning operational data into decisions.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#1F2328"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <!-- small bar-chart motif -->
  <g transform="translate(960 92)" fill="#58A6FF">
    <rect x="0"   y="80"  width="22" height="40"  rx="3" fill-opacity="0.35"/>
    <rect x="36"  y="56"  width="22" height="64"  rx="3" fill-opacity="0.5"/>
    <rect x="72"  y="68"  width="22" height="52"  rx="3" fill-opacity="0.4"/>
    <rect x="108" y="28"  width="22" height="92"  rx="3" fill-opacity="0.7"/>
    <rect x="144" y="0"   width="22" height="120" rx="3" fill-opacity="0.95"/>
  </g>
  <text x="72" y="128" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF">Mathew Joseph</text>
  <text x="72" y="180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#C9D1D9">Turning operational data into decisions.</text>
  <text x="72" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B949E">data · product · AI  —  Dubai, UAE</text>
</svg>
